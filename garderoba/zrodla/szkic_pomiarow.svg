<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <!-- Szkic orientacyjny (nie w skali dokładnej): rzut garderoby z góry z kodami pomiarów. Ściana tylna u góry. -->
  <rect width="760" height="640" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="bold">GARDEROBA: KODY POMIARÓW (rzut z góry, szkic orientacyjny)</text>
  <!-- ściany -->
  <rect x="80" y="60" width="534" height="447" fill="#f4f1ea" stroke="#222" stroke-width="6"/>
  <!-- otwór drzwi w ścianie przedniej -->
  <rect x="330" y="502" width="240" height="12" fill="#fff"/>
  <text x="370" y="568" fill="#555">DRZWI (skrzydło na zewnątrz)</text>
  <!-- pion -->
  <rect x="80" y="60" width="204" height="150" fill="#d9d4ca" stroke="#222" stroke-width="2"/>
  <text x="140" y="130" font-weight="bold">PION</text>
  <!-- wylot -->
  <circle cx="225" cy="210" r="9" fill="#2b3034"/>
  <text x="238" y="232" fill="#b00">W1–W4</text>
  <!-- gzyms -->
  <rect x="80" y="210" width="45" height="297" fill="#c7c1b5" stroke="#222" stroke-width="1.5"/>
  <text x="88" y="360" transform="rotate(-90 100 360)" fill="#b00">GZ1–GZ3</text>
  <!-- przewody wodne -->
  <circle cx="410" cy="70" r="5" fill="#d33"/><circle cx="440" cy="70" r="5" fill="#33d"/>
  <text x="395" y="100" fill="#b00">R1–R4</text>
  <!-- przewód elektryczny -->
  <path d="M 128 470 l 10 -6 l -4 10 z" fill="#e58a2b"/>
  <text x="140" y="478" fill="#b00">E1, E2</text>
  <!-- lampa -->
  <circle cx="330" cy="235" r="14" fill="none" stroke="#e0a526" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="350" y="240" fill="#b00">L1–L3</text>

  <!-- wymiary -->
  <g stroke="#b00" fill="#b00" stroke-width="1.2">
    <line x1="80" y1="440" x2="614" y2="440"/><line x1="80" y1="434" x2="80" y2="446"/><line x1="614" y1="434" x2="614" y2="446"/>
    <line x1="284" y1="160" x2="614" y2="160"/><line x1="284" y1="154" x2="284" y2="166"/><line x1="614" y1="154" x2="614" y2="166"/>
    <line x1="590" y1="60" x2="590" y2="507"/><line x1="584" y1="60" x2="596" y2="60"/><line x1="584" y1="507" x2="596" y2="507"/>
    <line x1="250" y1="210" x2="250" y2="507"/><line x1="244" y1="507" x2="256" y2="507"/>
    <line x1="80" y1="44" x2="284" y2="44"/><line x1="80" y1="38" x2="80" y2="50"/><line x1="284" y1="38" x2="284" y2="50"/>
    <line x1="64" y1="60" x2="64" y2="210"/><line x1="58" y1="60" x2="70" y2="60"/><line x1="58" y1="210" x2="70" y2="210"/>
    <line x1="570" y1="525" x2="614" y2="525"/><line x1="330" y1="525" x2="570" y2="525"/><line x1="614" y1="519" x2="614" y2="531"/><line x1="570" y1="519" x2="570" y2="531"/><line x1="330" y1="519" x2="330" y2="531"/>
    <line x1="125" y1="507" x2="614" y2="125" stroke-dasharray="6 4" stroke="#888"/>
  </g>
  <g fill="#b00" font-weight="bold">
    <text x="420" y="434">A</text>
    <text x="450" y="154">S</text>
    <text x="598" y="300">G</text>
    <text x="256" y="380">T</text>
    <text x="170" y="40">PX</text>
    <text x="36" y="140">PZ</text>
    <text x="586" y="545">DX</text>
    <text x="440" y="545">DW</text>
    <text x="360" y="320" fill="#888">P1</text>
  </g>
  <!-- opisy ścian -->
  <text x="300" y="54" fill="#333">ŚCIANA TYLNA (na wprost)</text>
  <text x="40" y="420" transform="rotate(-90 40 420)" fill="#333">ŚCIANA LEWA (gzyms)</text>
  <text x="640" y="200" transform="rotate(90 640 200)" fill="#333">ŚCIANA PRAWA</text>
  <text x="120" y="530" fill="#333">ŚCIANA PRZEDNIA (drzwi)</text>
  <text x="20" y="600" font-size="12" fill="#555">Wysokości: J (podłoga–sufit), K (kafelki z klejem), DH (otwór drzwi), W1, GZ1, R3, E2, L3: od podłogi lub sufitu.</text>
  <text x="20" y="620" font-size="12" fill="#555">A, S, G, T mierzyć na wysokości 0, 1 i 2 m. Zdjęcie = nazwa pliku z kodem i odczytem, np. „A 1785.jpg”.</text>
</svg>
